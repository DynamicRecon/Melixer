name: Deploy Melixer

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Build and Deploy Melixer
    runs-on: self-hosted   # ← Uses your intranet server runner

    steps:

      # Step 1 — Checkout latest code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3 — Install React dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Step 4 — Create production .env
      - name: Create frontend .env.production
        working-directory: frontend
        run: |
          echo "REACT_APP_API_URL=https://melixer.roseweb.local/api" > .env.production

      # Step 5 — Build React app
      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      # Step 6 — Copy React build to Apache web root
      - name: Deploy frontend build to web root
        run: |
          sudo rm -rf /var/www/melixer/*
          sudo cp -r frontend/build/* /var/www/melixer/
          sudo chown -R www-data:www-data /var/www/melixer/
          sudo chmod -R 755 /var/www/melixer/

      # Step 7 — Install Python dependencies
      - name: Install Python dependencies
        run: |
          source /path/to/your/project/venv/bin/activate
          pip install -r backend/requirements.txt

      # Step 8 — Run Django migrations
      - name: Run Django migrations
        run: |
          source /path/to/your/project/venv/bin/activate
          cd backend
          python manage.py migrate --settings=myproject.settings

      # Step 9 — Collect static files
      - name: Collect Django static files
        run: |
          source /path/to/your/project/venv/bin/activate
          cd backend
          python manage.py collectstatic --noinput --settings=myproject.settings

      # Step 10 — Restart Apache
      - name: Restart Apache
        run: sudo systemctl restart apache2

      # Step 11 — Verify Apache is running
      - name: Verify Apache status
        run: sudo systemctl status apache2 --no-pager