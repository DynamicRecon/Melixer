name: Deploy Melixer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      # Step 1 — Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Copy SSL certs into nginx/certs
      - name: Setup SSL certs
        run: |
          mkdir -p nginx/certs
          sudo cp /etc/ssl/certs/melixer.crt nginx/certs/melixer.crt
          sudo cp /etc/ssl/private/melixer.key nginx/certs/melixer.key

      # Step 3 — Create .env.docker from GitHub Secrets
      - name: Create .env.docker
        run: |
          cat > .env.docker << EOF
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET }}
          DJANGO_DEBUG=False
          DJANGO_ALLOWED_HOSTS=melixer.roseweb.local,localhost
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          REACT_APP_API_URL=https://melixer.roseweb.local:3443/api
          EOF

      # Step 4 — Pull latest images
      - name: Pull latest base images
        run: docker compose pull --ignore-buildable

      # Step 5 — Build Docker images
      - name: Build Docker images
        run: docker compose build --no-cache

      # Step 6 — Stop existing containers
      - name: Stop existing containers
        run: docker compose down --remove-orphans

      # Step 7 — Start new containers
      - name: Start containers
        run: docker compose up -d

      # Step 8 — Verify containers are running
      - name: Verify deployment
        run: |
          sleep 10
          docker compose ps
          docker compose logs --tail=20 backend
          docker compose logs --tail=20 frontend

      # Step 9 — Cleanup old images
      - name: Cleanup old Docker images
        run: docker image prune -f
