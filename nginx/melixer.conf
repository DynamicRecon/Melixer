# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name melixer.roseweb.local;
    return 301 https://$host:3443$request_uri;
}

# HTTPS Frontend + API Proxy
server {
    listen 3443 ssl;
    server_name melixer.roseweb.local;

    # SSL
    ssl_certificate     /etc/ssl/certs/melixer.crt;
    ssl_certificate_key /etc/ssl/private/melixer.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # React static files
    root /usr/share/nginx/html;
    index index.html;

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Gunicorn
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django static files
    location /static/ {
        alias /app/staticfiles/;
    }
}