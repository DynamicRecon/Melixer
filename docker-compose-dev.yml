version: "3.9"

services:
  backend:
    volumes:
      - ./backend:/app # Live reload — no rebuild needed
    environment:
      DJANGO_DEBUG: "True"
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --reload myproject.wsgi:application"
    ports:
      - "8000:8000" # Expose directly for dev

  frontend:
    build:
      args:
        REACT_APP_API_URL: http://localhost:8000/api
    ports:
      - "3000:80"
